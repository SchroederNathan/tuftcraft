<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TuftCraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Courier New', monospace; user-select: none; }
  #game { position: absolute; inset: 0; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none; z-index: 5;
    mix-blend-mode: difference;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #ddd;
  }
  #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair::after { left: 0; top: 9px; width: 20px; height: 2px; }

  #hotbar {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 0; z-index: 5;
    background: rgba(0,0,0,0.35); padding: 3px; border-radius: 4px;
  }
  .slot {
    width: 52px; height: 52px; border: 3px solid #555;
    background: rgba(20,20,20,0.6); position: relative; cursor: pointer;
  }
  .slot.selected { border-color: #fff; }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .slot .key {
    position: absolute; top: 1px; left: 3px; color: #ccc; font-size: 10px;
    text-shadow: 1px 1px 0 #000; z-index: 2;
  }

  #itemname {
    position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
    color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.7); font-size: 16px;
    z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.5s;
  }

  #hud {
    position: absolute; top: 8px; left: 8px; color: #fff; font-size: 12px;
    text-shadow: 1px 1px 0 #000; z-index: 5; pointer-events: none; line-height: 1.5;
  }

  #water-overlay {
    position: absolute; inset: 0; background: rgba(20, 60, 160, 0.35);
    pointer-events: none; z-index: 4; display: none;
  }

  #overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(10, 12, 20, 0.75); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #eee; cursor: pointer; text-align: center;
  }
  #overlay h1 {
    font-size: 56px; letter-spacing: 4px; color: #fff;
    text-shadow: 3px 3px 0 #3a5e2a, 6px 6px 0 rgba(0,0,0,0.5); margin-bottom: 8px;
  }
  #overlay .sub { color: #9c9; margin-bottom: 28px; font-size: 14px; }
  #overlay .play {
    font-size: 22px; padding: 14px 46px; border: 3px solid #888;
    background: linear-gradient(#7a7a7a, #5c5c5c); color: #fff;
    text-shadow: 2px 2px 0 #333; margin-bottom: 30px;
  }
  #overlay:hover .play { border-color: #fff; background: linear-gradient(#8a8a8a, #6c6c6c); }
  #overlay table { border-collapse: collapse; font-size: 14px; color: #ccc; }
  #overlay td { padding: 3px 14px; text-align: left; }
  #overlay td.k { color: #ffd966; text-align: right; }
  #loading { margin-top: 24px; color: #8af; font-size: 13px; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="water-overlay"></div>
  <div id="crosshair"></div>
  <div id="hud"></div>
  <div id="itemname"></div>
  <div id="hotbar"></div>
  <div id="overlay">
    <h1>TUFTCRAFT</h1>
    <div class="sub">a minecraft clone for the browser</div>
    <div class="play">▶ Click to Play</div>
    <table>
      <tr><td class="k">W A S D</td><td>move</td></tr>
      <tr><td class="k">Mouse</td><td>look</td></tr>
      <tr><td class="k">Left click</td><td>break block</td></tr>
      <tr><td class="k">Right click</td><td>place block</td></tr>
      <tr><td class="k">Space</td><td>jump</td></tr>
      <tr><td class="k">Shift</td><td>sprint</td></tr>
      <tr><td class="k">1–9 / scroll</td><td>select block</td></tr>
      <tr><td class="k">F</td><td>toggle fly (Space/C up/down)</td></tr>
      <tr><td class="k">R</td><td>reset world</td></tr>
      <tr><td class="k">Esc</td><td>pause</td></tr>
    </table>
    <div id="loading"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
